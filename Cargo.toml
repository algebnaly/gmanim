[package]
name = "gmanim-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "gmanim_core"

[dependencies]
nalgebra = "0.35"
rusttype = "0.9.3"
usvg = "0.47"
fern = "*"
log = "*"
humantime = "*"
cfg-if = "1.0.0"
ffmpeg-next = "8.1"
yuv = { version = "0.8.11", features = ["fast_mode"] }
rayon = "1.12.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
ash = "0.38.0"
gpu-allocator = { version = "0.28.0", features = ["vulkan"] }
naga = { version = "29.0.3", features = ["wgsl-in", "spv-out"] }
lyon = "1.0.19"
memoffset = "0.9.1"

[features]
default = ["gmfloat_f32"]
gmfloat_f32 = []
gmfloat_f64 = []
gmfloat_f16 = []
